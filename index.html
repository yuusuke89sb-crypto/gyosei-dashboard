  <!-- 仕訳データ投入（IDベースで重複防止） -->
  <script>
  (function(){
    var journals=JSON.parse(localStorage.getItem('gyosei_journals')||'[]');
    var now=new Date().toISOString();
    var seeds=[
      {id:'j_reg_001',date:'2026-03-24',amount:299000,debit:'租税公課',credit:'現金',description:'行政書士登録料',createdAt:now},
      {id:'j_reg_002',date:'2026-03-24',amount:550,debit:'支払手数料',credit:'現金',description:'登録手数料',createdAt:now},
      {id:'j_reg_003',date:'2026-03-24',amount:720,debit:'雑費',credit:'現金',description:'登録写真代',createdAt:now},
      {id:'j_reg_004',date:'2026-03-25',amount:1700,debit:'広告宣伝費',credit:'未払金',description:'名刺代',createdAt:now}
    ];
    var added=0;
    seeds.forEach(function(e){if(!journals.some(function(j){return j.id===e.id})){journals.push(e);added++}});
    if(added>0){localStorage.setItem('gyosei_journals',JSON.stringify(journals));console.log('✅ 仕訳データ投入: '+added+'件')}
  })();
  </script>
